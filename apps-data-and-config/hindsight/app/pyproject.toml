[project]
name = "genai-hindsight"
version = "0.1.0"
description = "Servidor Hindsight (memoria a largo plazo) del stack GenAI"
requires-python = ">=3.14,<3.15"
dependencies = [
    # API sin torch; local-onnx añade los embeddings locales (onnxruntime).
    "hindsight-api-slim[local-onnx]>=1.2.1",
]

[tool.uv]
package = false
# Hindsight usa LiteLLM como librería: misma rama LTS 1.108.x que el proxy (litellm/app/pyproject.toml).
constraint-dependencies = ["litellm>=1.108.11,<1.109"]
