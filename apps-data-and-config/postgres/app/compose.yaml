# Postgres 18 con pgvector. Las variables vienen de config/.env (usa compose.sh).
name: ${COMPOSE_PROJECT_NAME:-genai-postgres}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    # Corre con tu usuario: los ficheros de data/ son tuyos, no de root.
    user: "${HOST_UID:?usa compose.sh}:${HOST_GID:?usa compose.sh}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-genai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ../data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
