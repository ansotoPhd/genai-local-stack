# -----------------------------------------------------------------------------------------
#  Configuración de LiteLLM (la plantilla versionada es config.example.yaml).
#  Único proveedor: OpenCode Go (suscripción). La clave va en config/.env (OPENCODE_GO_API_KEY).
#
#  Los modelos se generan desde https://opencode.ai/inference/go/v1/models, que ya publica
#  precios, contexto y capacidades. Nombres: go-<id>.
#
#  x-opencode-session: identificador estable que exige el gateway de Go. Aquí es fijo para
#  todo el stack: 86745f52-0cfb-508d-84b2-6efa56e9a04a
# -----------------------------------------------------------------------------------------

credential_list:
  - credential_name: opencode_go
    credential_values:
      api_key: os.environ/OPENCODE_GO_API_KEY
    credential_info:
      description: "OpenCode Go (suscripción)"

